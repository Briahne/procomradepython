<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProComrade Python Portal Matrix</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="portal-container">
        <header>
            <h1 class="comic-title">PROCOMRADE PYTHON MATRIX</h1>
        </header>

        <!-- VIEW 1: AUTHENTICATION & TIKTOK PARODY AVATAR SELECTION -->
        <section id="auth-view" class="matrix-card">
            <div class="chapter-badge">SYSTEM INITIALIZATION</div>
            <h2 class="section-heading">Create Ledger Account & Select Avatar</h2>
            
            <form id="register-form" onsubmit="event.preventDefault(); handleRegistration();">
                <div class="form-group">
                    <label for="username">Comrade Username:</label>
                    <input type="text" id="username" required autocomplete="off" placeholder="Enter codename...">
                </div>
                <div class="form-group">
                    <label for="password">Security Password:</label>
                    <input type="password" id="password" required placeholder="Keep it safe...">
                </div>

                <label class="avatar-label">Select Your Shujaaz Squad Member:</label>
                <div class="avatar-grid">
                    <!-- 5 Male Slots (Blue Theme) -->
                    <div class="avatar-slot slot-boy" data-id="m1" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="m1.png" alt="Boy 1" onerror="this.style.display='none'"></div>
                        <span>BOY 1</span>
                    </div>
                    <div class="avatar-slot slot-boy" data-id="m2" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="m2.png" alt="Boy 2" onerror="this.style.display='none'"></div>
                        <span>BOY 2</span>
                    </div>
                    <div class="avatar-slot slot-boy" data-id="m3" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="m3.png" alt="Boy 3" onerror="this.style.display='none'"></div>
                        <span>BOY 3</span>
                    </div>
                    <div class="avatar-slot slot-boy" data-id="m4" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="m4.png" alt="Boy 4" onerror="this.style.display='none'"></div>
                        <span>BOY 4</span>
                    </div>
                    <div class="avatar-slot slot-boy" data-id="m5" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="m5.png" alt="Boy 5" onerror="this.style.display='none'"></div>
                        <span>BOY 5</span>
                    </div>
                    
                    <!-- 5 Female Slots (Magenta Theme) -->
                    <div class="avatar-slot slot-girl" data-id="f1" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="f1.png" alt="Girl 1" onerror="this.style.display='none'"></div>
                        <span>GIRL 1</span>
                    </div>
                    <div class="avatar-slot slot-girl" data-id="f2" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="f2.png" alt="Girl 2" onerror="this.style.display='none'"></div>
                        <span>GIRL 2</span>
                    </div>
                    <div class="avatar-slot slot-girl" data-id="f3" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="f3.png" alt="Girl 3" onerror="this.style.display='none'"></div>
                        <span>GIRL 3</span>
                    </div>
                    <div class="avatar-slot slot-girl" data-id="f4" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="f4.png" alt="Girl 4" onerror="this.style.display='none'"></div>
                        <span>GIRL 4</span>
                    </div>
                    <div class="avatar-slot slot-girl" data-id="f5" onclick="selectAvatar(this)">
                        <div class="vector-rig"><img src="f5.png" alt="Girl 5" onerror="this.style.display='none'"></div>
                        <span>GIRL 5</span>
                    </div>
                </div>

                <button type="submit" class="comic-btn action-wide">INITIALIZE PORTAL LOG</button>
            </form>
        </section>

        <!-- VIEW 2: GAME TERMINAL HUB -->
        <section id="game-view" class="matrix-card hidden">
            <div id="chapter-header-badge" class="chapter-badge">STAGE PROGRESSION</div>
            
            <div class="user-status-bar">
                <div class="current-user-info">
                    <div id="active-avatar-rig" class="mini-rig"></div>
                    <span id="user-display">Comrade: Anonymous</span>
                </div>
                <button onclick="handleLogout()" class="logout-btn">SECURE LOCKOUT</button>
            </div>

            <!-- Reading Panel Mode -->
            <div id="reading-panel" class="content-panel">
                <h2 id="reading-title" class="panel-title">Reading Material</h2>
                <div id="reading-body" class="comic-reading-text"></div>
                <button onclick="startChapterQuiz()" class="comic-btn">LAUNCH VERIFICATION CHECKPOINT</button>
            </div>

            <!-- Quiz Panel Mode -->
            <div id="quiz-panel" class="content-panel hidden">
                <h2 class="panel-title">Verification Matrix</h2>
                <p id="question-text" class="comic-text">Processing...</p>
                <div id="options-container" class="options-grid"></div>
                <div id="feedback-box" class="feedback hidden"></div>
                <button id="next-btn" class="comic-btn hidden">NEXT INQUIRY</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>

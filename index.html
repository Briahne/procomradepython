<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProComrade Python Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Comic Book Style -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="portal-container">
        <header>
            <h1 class="comic-title">PROCOMRADE PYTHON MATRIX</h1>
            <p class="subtitle">Welcome back, Comrade! Resuming your coding portal ledger...</p>
        </header>

        <main class="matrix-card">
            <div class="chapter-badge">CHAPTER 1: THE CORE MATRIX</div>
            <div id="quiz-box">
                <p id="question-text" class="comic-text">Loading neural challenge...</p>
                <div id="options-container" class="options-grid">
                    <!-- JavaScript will inject answer choices here -->
                </div>
            </div>
            <div id="feedback-box" class="feedback hidden"></div>
        </main>

        <footer>
            <button id="next-btn" class="comic-btn hidden">NEXT CHALLENGE</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
